<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشاريع الطويلة · لازم للخدمات الطبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-photo"></div>
<div class="bg-wash"></div>

<div class="wrap">

  <header>
    <div class="brand">
      <img class="brand-logo" src="assets/logo-lazem.png" alt="شعار لازم للخدمات الطبية">
      <div>
        <p class="eyebrow">لازم للخدمات الطبية</p>
        <h1>المشاريع الطويلة</h1>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="pulse-wrap" aria-hidden="true">
    <svg viewBox="0 0 1180 38" preserveAspectRatio="none">
      <path class="pulse-fade" d="M0 19 H1180"/>
      <path class="pulse-line" id="pulseLine" d="M0 19 L260 19 L280 4 L300 34 L318 19 L340 19 L920 19 L940 4 L960 34 L978 19 L1000 19 L1180 19"/>
    </svg>
  </div>

  <main class="grid" id="grid"></main>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
